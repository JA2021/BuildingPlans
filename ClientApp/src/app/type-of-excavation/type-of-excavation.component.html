<ng-template #content let-modal>
  <div class="standardHeader">
    <p class="standardText" id="modal-basic-title">Creating a new type of excavation</p>
    <button type="button" class="standardCloseBtn" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>
  <div class="modal-body">

    <form [formGroup]="addTypeOfExcavation">
      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Type of excavation</mat-label>
          <input matInput  type="text" id="newTOEName" formControlName="newTOEName" placeholder="Enter the type of excavation name">
        </mat-form-field>
      </div>
    </form>

  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-success" (click)="onTOECreate();modal.close('Save click')">Save</button>
  </div>
</ng-template>

<div class="container-fluid">
  <button mat-raised-button color="create" (click)="openXl(content)">Create a new type of excavation</button>


  <!--display all docs Display all docs-->

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">


    <ng-container matColumnDef="typeOfExcavationName">
      <th mat-header-cell *matHeaderCellDef>Type Of Excavation Name </th>
      <td mat-cell *matCellDef="let element"> {{element.typeOfExcavationName}} </td>
    </ng-container>


    <ng-container matColumnDef="actions"><!--test-->
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let i = index">

        <button mat-raised-button color="orange" matTooltip="Edit" (click)="openEditTOEModal(editTOEmodal,i)"><img src="assets/fontawesome-free-6.4.2-web/svgs/regular/pencil-solid.svg" class="icon4" style="filter: invert();"> </button>
        <button mat-raised-button color="warn" matTooltip="Delete" (click)=" getCurrentTOEID(i);onTOEDelete(i)"><img src="assets/fontawesome-free-6.4.2-web/svgs/regular/trash-can-solid-white.svg" class="icon4" style="filter: invert();"> </button>

      </td>
      <td mat-cell *matCellDef="let element">  </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</div>


<ng-template #editTOEmodal let-modal>
  <div class="standardHeader">
    <p class="standardText" id="modal-basic-title">Edit type of excavation</p>
    <button type="button" class="standardCloseBtn" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
  </div>
  <div class="modal-body">

    <form [formGroup]="editTOEForm" (ngSubmit)="onTOEEdit()">
      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Type of excavation</mat-label>
          <input matInput  type="text" formControlName="editTOEName" placeholder="Enter the type of excavation name">
        </mat-form-field>
      </div>
    </form>

  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-success" (click)="onTOEEdit();modal.close('Save click')">Save</button>
  </div>
</ng-template>
