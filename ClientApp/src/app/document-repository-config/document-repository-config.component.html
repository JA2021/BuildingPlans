<button mat-raised-button color="FAQ" (click)="openCreateCategory(createCategory);getAllDepartments()">Add New Document Repository Category</button>


<table mat-table [dataSource]="dataSource">

  <ng-container matColumnDef="CategoryName">
    <th mat-header-cell *matHeaderCellDef>Document Category Name </th>
    <td mat-cell *matCellDef="let element"> {{ element.documentCategoryName }} </td>
  </ng-container>

  <ng-container matColumnDef="DepartmentName">
    <th mat-header-cell *matHeaderCellDef> DepartmentName </th>
    <td mat-cell *matCellDef="let element"> {{ element.departmentName }} </td>
  </ng-container>

  <ng-container matColumnDef="DateCreated">
    <th mat-header-cell *matHeaderCellDef> Date Created </th>
    <td mat-cell *matCellDef="let element"> {{ element.dateCreated }} </td>
  </ng-container>



  <ng-container matColumnDef="Actions" >
    <th mat-header-cell *matHeaderCellDef> Actions </th>
    <td mat-cell *matCellDef="let element; let i = index">

      <button mat-raised-button color="warn" matTooltip="Delete Document Repository Category" (click)="onDeleteCategoryByCategoryID(i)"><img src="assets/fontawesome-free-6.4.2-web/svgs/regular/trash-can-solid-white.svg" class="icon4" style="filter: invert();"></button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>


<ng-template #createCategory let-modal>
  <div class="standardHeader">
    <p class="standardText" id="modal-basic-title">Creating a new Document Repository Category</p>
    <button type="button" class="standardCloseBtn" aria-label="Close" (click)="modal.dismiss('Cross click');clearInputAndDropdown()"></button>
  </div>
  <div class="modal-body">

    <mat-form-field>
      <mat-label>FunctionalArea </mat-label>
      <mat-select #departmentDropDown aria-label="Default select example" [(ngModel)]="DepartmentID">
        <mat-option *ngFor="let department of DepartmentsList" [value]="department.departmentID">{{ department.departmentName }}</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Document Category</mat-label>
        <input matInput  type="text" placeholder="Enter a Document Repository Category" [(ngModel)]="newDocumentCategory">
      </mat-form-field>
    </div>
    </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-success" (click)="onSaveClick();getAllDocumentCategories();modal.dismiss('Cross click');clearInputAndDropdown()">Save</button>
  </div>
</ng-template>
