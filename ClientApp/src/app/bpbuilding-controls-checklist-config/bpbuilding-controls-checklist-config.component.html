<button mat-raised-button color="create" (click)=" openAddNewChecklistItem(addChecklistItem)">Add New Building Control Checklist Item</button>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <ng-container matColumnDef="ChecklistItem">
    <th mat-header-cell *matHeaderCellDef>Checklist Item</th>
    <td mat-cell *matCellDef="let element">{{element.ChecklistItem}}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let i = index">
      <button mat-raised-button class ="orange" matToolTip="Edit Checklist Item"><img src="assets/fontawesome-free-6.4.2-web/svgs/solid/pencil.svg" class="icon4" /> </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row;columns:displayedColumns;"></tr>
</table>


<ng-template #addChecklistItem let-modal class="mat-elevation-z8">
  <div class="standardHeader">
    <p class="standardText"> Adding a new Checklist Item</p>
    <button type="button" class="standardCloseBtn" aria-label="Close" (click)="modal.dismiss('Cross Click')"></button>
  </div>

  <div class="modal-body">

    <div class="row">
      <div class="col">
        <mat-form-field appearance="outline">
          <mat-label>Functional Area*</mat-label>
          <input matInput  type="text" [(ngModel)]="newFunctionalArea" name="newFunctionalArea" placeholder="Enter functional Area" disabled>
        </mat-form-field>
      </div>
    </div>


  <div class="row">
    <div class="col">
      <mat-form-field appearance="outline">
        <mat-label>Checklist Item*</mat-label>
        <input matInput  type="text" [(ngModel)]="newChecklistItem" name="newChecklistItem" placeholder="Enter new checklist item">
      </mat-form-field>
    </div>
  </div>
  </div>

  <div class="modal-footer">
    <button type="submit" class="btn btn-outline-success" (click)=" AddUpdateBuildingControlChecklistItem()">Save</button>
  </div>
</ng-template>
