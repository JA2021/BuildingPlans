<div class="container">
  <div class="GoodCase" *ngIf="data.message == 'Draft Saved!' || data.message == 'Application Created'|| data.message == 'Application Actioned'|| data.message == 'User Assigned Successfully'|| data.message == 'Task Completed'">
    <div class="notification-text">

      <span>{{ data.message}}</span>
    </div>
  </div>

  <div class="Notification" *ngIf="data.message == 'Please enter your first name and surname only'">
    <div class="notification-text">

      <span>{{ data.message}}</span>
    </div>
  </div>
</div>


<div class ="cardOTP" *ngIf ="data.message == 'OTP VERIFIED'">
  <div class="cardOTP" id="cardOTP">
    <div class="content">
      <span>OTP VERIFIED</span>
    </div>
  </div>
</div>
