
<div  *ngFor="let inspection of AllInspections; let i = index">
  <mat-expansion-panel [expanded]="openPanelIndex === i"
                       (opened)="getAllInspectionCommentsForBySpectionName(i)">
    <mat-expansion-panel-header>
      <mat-panel-title>{{ inspection.InspectionName }}</mat-panel-title>
    </mat-expansion-panel-header>

    <div *ngIf="inspection.InspectionName == 'Completion Checklist'">
      <h4>Construction Checklist</h4>
      <app-bpconstruction-checklist></app-bpconstruction-checklist>
    </div>

    <h4>Comments</h4>
    <div>
      <table mat-table class="mat-elevation-z8" [dataSource]="dataSource" *ngIf="dataSource.length > 0">

        <ng-container matColumnDef="Comment">
          <th mat-header-cell *matHeaderCellDef> Comment</th>
          <td mat-cell *matCellDef="let element">{{element.Notes}}</td>
        </ng-container>

        <ng-container matColumnDef="Status">
          <th mat-header-cell *matHeaderCellDef> Status</th>
          <td mat-cell *matCellDef="let element"> {{element.Status}}</td>
        </ng-container>

        <ng-container matColumnDef="DateCreated">
          <th mat-header-cell *matHeaderCellDef> Date Created</th>
          <td mat-cell *matCellDef="let element">{{element.DateCreated}}</td>
        </ng-container>


        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row;columns:displayedColumns;"></tr>
      </table>


      <div class="row">
        <div class="form-floating mb-3 mt-3">
          <textarea type="text" class="form-control" [(ngModel)]="newComment" name="newComment" placeholder="Enter new comment"></textarea>
          <label for="newComment"> Add a new Comment </label>
        </div>
      </div>
      <div>
        <button mat-raised-button color="green" [disabled]="newComment == null || newComment == ''" (click)="SaveNewComment()">Save new comment</button>
      </div>

      <br />

      <div class="row">
        <div class="col">
          <mat-checkbox [(ngModel)]="inspection.Inspected" [disabled]="inspection.Inspected == true " (change)="openInspectionDate(InspectionDate)">Inspection Perfomed ? </mat-checkbox>
        </div>

        <div class="col" *ngIf="inspection.DateInspected != null">
          <div class="form-floating mb-3 mt-3">
            <textarea type="text" class="form-control" [(ngModel)]="inspection.DateInspected" name="DateInspected" placeholder="Enter new comment"></textarea>
            <label for="DateInspected">Date Inspected</label>
          </div>
        </div>
      </div>
    </div>

  </mat-expansion-panel>

 
</div>


<ng-template #InspectionDate let-modal>

  <div class="modal-header">
    <h4 class="modal-title">Select Inspection Date</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)=" closeDateModal();modal.dismiss('Cross click')"></button>
  </div>

  <div class="modal-body">

    <p><em>* Please ensure inspection has been completed before selecting the date  </em></p>

    <div class="row">
      <div class="col">
        <div class="form-floating mb-3 mt-3">
          <input type="date" class="form-control" [(ngModel)]="selectedDate" id="startDate" placeholder="Enter Inspection Date" name="expectedStartDate" > <!--[min]="getCurrentDate()"-->
          <label for="name">Inspection Completion Date </label>
        </div>
      </div>

    </div>

    </div>

  <div class="modal-footer">
    <button type="submit" class="btn btn-outline-success" (click)="AddInspectionDate();modal.close('Save click')" >Save</button>
  </div>
</ng-template>
