<div class="modal-header">
  <h4 class="modal-title">Select Comments for Referral Letter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
</div>

<div class="modal-body">
  <div class="cont3">
    <!-- Search Filter -->
    <mat-form-field class="full-width">
      <mat-label>Search Comments</mat-label>
      <input matInput [(ngModel)]="searchText" (keyup)="filterComments()" placeholder="Search...">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <!-- Comments Table -->
    <table mat-table [dataSource]="dataSourceComments" class="mat-elevation-z8">
      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>Select</th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox
            (click)="$event.stopPropagation()"
            (change)="toggleCommentSelection(element)"
            [checked]="isSelected(element)">
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- Comment Column -->
      <ng-container matColumnDef="comment">
        <th mat-header-cell *matHeaderCellDef>Comment</th>
        <td mat-cell *matCellDef="let element">{{element.Comment}}</td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let element">{{element.DateCreated | date}}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <button mat-raised-button
                  color="blue"
                  matTooltip="Edit comment"
                  (click)="openEditComment(element, editCommentModal)"
                  *ngIf="isSelected(element)">
            <img src="assets/fontawesome-free-6.4.2-web/svgs/regular/eye-solid.svg" class="icon">
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>

<div class="modal-footer">
  <button mat-raised-button color="warn" (click)="modal.dismiss()">Cancel</button>
  <button mat-raised-button color="primary" (click)="confirmSelection()">
    Confirm Selection ({{selectedComments.length}})
  </button>
</div>

<!-- Edit Comment Modal -->
<ng-template #editCommentModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">Edit Comment for Referral Letter</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <mat-form-field class="example-full-width">
      <mat-label>Edit comment</mat-label>
      <textarea matInput
                [(ngModel)]="selectedComment.Comment"
                placeholder="Enter your comment"
                maxlength="250">
      </textarea>
      <mat-hint align="end">{{selectedComment.Comment?.length || 0}}/250</mat-hint>
    </mat-form-field>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-success" (click)="saveEditedComment()">Save</button>
  </div>
</ng-template>
